<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VideoActAgent · Prompt to Blender</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#64748b; --line:#d9e2ec; --blue:#2563eb; --soft:#f5f8fc; --danger:#b42318; --ok:#137333; }
    * { box-sizing:border-box; } body { margin:0; background:var(--soft); color:var(--ink); font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { max-width:980px; margin:0 auto; padding:28px 18px; } h1 { margin:0; font-size:27px; } p { margin:6px 0; color:var(--muted); } .sub { font-size:13px; }
    .card { margin-top:18px; padding:18px; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 2px 9px #19345b0b; }
    textarea { width:100%; min-height:130px; resize:vertical; padding:11px; border:1px solid #bdc9d8; border-radius:8px; font:inherit; color:var(--ink); }
    button { margin-top:12px; padding:10px 17px; border:0; border-radius:8px; background:var(--blue); color:#fff; font-weight:650; cursor:pointer; } button:disabled { opacity:.5; cursor:not-allowed; }
    #status { margin-top:12px; color:var(--muted); } #error { display:none; margin-top:12px; padding:10px; color:var(--danger); background:#fff3f1; border:1px solid #f1b4ad; border-radius:8px; white-space:pre-wrap; }
    video { width:100%; min-height:220px; background:#10151c; border-radius:8px; } .hint { font-size:12px; color:var(--muted); margin-top:10px; }
  </style>
</head>
<body>
  <main>
    <h1>Prompt → ShotScript → Blender → 视频</h1>
    <p>输入一段完整场景描述，Agent 先生成 ShotScript，再生成受约束的 Blender Python，最后在本地真实渲染。</p>
    <p class="sub">旧单机位（8769）与三机位/向导（8770）不受影响。本页只展示最终 Blender 视频。</p>
    <section class="card">
      <label for="prompt">场景 Prompt</label>
      <textarea id="prompt" placeholder="例如：在车站大厅，一名橙色外套旅客拖着行李从左向右走向等候的朋友，镜头保持全景并展示站台环境。"></textarea>
      <button id="runButton">生成真实视频</button>
      <div id="status">等待输入。</div>
      <div id="error"></div>
      <div class="hint">固定默认：DeepSeek-v4-pro、5 秒、8 FPS、640×360；失败时最多按错误反馈自动修复两次。</div>
    </section>
    <section class="card">
      <h2>Blender 渲染结果</h2>
      <video id="resultVideo" controls preload="metadata"></video>
      <p id="emptyHint" class="hint">视频完成后会显示在这里。</p>
    </section>
  </main>
  <script>
  (() => {
    const $ = id => document.getElementById(id);
    let operation = '';
    let timer = 0;
    async function request(path, options = {}) {
      const response = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
      const value = await response.json();
      if (!response.ok) throw new Error(value.error?.message || ('HTTP ' + response.status));
      return value;
    }
    function showError(message) { $('error').textContent = message; $('error').style.display = 'block'; }
    function clear() { $('error').style.display = 'none'; $('resultVideo').removeAttribute('src'); $('emptyHint').textContent = '视频生成中，完成后会显示在这里。'; }
    async function poll() {
      if (!operation) return;
      try {
        const value = await request('/api/prompt-status?operation=' + encodeURIComponent(operation));
        $('status').textContent = value.state === 'done' ? '完成：Blender 视频已生成。' : value.state === 'error' ? '失败。' : ('处理中：' + (value.stage || 'agent'));
        if (value.video_url) { $('resultVideo').src = value.video_url + '&t=' + Date.now(); $('emptyHint').textContent = '仅展示本次生成的最终视频。'; }
        if (value.state === 'error') { showError(value.error || '流水线失败'); $('runButton').disabled = false; operation = ''; return; }
        if (value.state === 'done') { $('runButton').disabled = false; operation = ''; return; }
        timer = window.setTimeout(poll, 1000);
      } catch (error) { showError(error.message || String(error)); $('runButton').disabled = false; }
    }
    $('runButton').onclick = async () => {
      const prompt = $('prompt').value.trim();
      if (!prompt) { showError('请先输入场景 Prompt。'); return; }
      window.clearTimeout(timer); clear(); $('runButton').disabled = true; $('status').textContent = '正在启动 Agent…';
      try { const value = await request('/api/prompt-run', { method:'POST', body:JSON.stringify({ prompt }) }); operation = value.operation_id; poll(); }
      catch (error) { showError(error.message || String(error)); $('runButton').disabled = false; }
    };
  })();
  </script>
</body>
</html>
