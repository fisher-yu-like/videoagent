<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manual trajectory observer</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #11151b; color: #edf2f7; }
    main { width: min(1040px, 96vw); margin: 20px auto; }
    .notice { color: #f6c85f; }
    .stage { position: relative; display: inline-block; max-width: 100%; }
    canvas { max-width: 100%; height: auto; border: 1px solid #465568; cursor: crosshair; }
    .toolbar { display: flex; gap: 10px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
    button { padding: 8px 14px; border: 1px solid #60758f; border-radius: 5px; background: #243244; color: white; }
    button:disabled { opacity: .45; }
    #status { white-space: pre-wrap; }
  </style>
</head>
<body>
<main>
  <h1>Manual visual trajectory annotation</h1>
  <p class="notice">Each selected frame requires one human decision: click the target, or choose Mark occluded. Nothing is auto-tracked.</p>
  <div id="identity"></div>
  <div class="stage"><canvas id="canvas"></canvas></div>
  <div class="toolbar">
    <button id="previous">Previous</button>
    <strong id="progress"></strong>
    <button id="occluded">Mark occluded</button>
    <button id="clear">Clear current</button>
    <button id="next">Next</button>
    <button id="save" disabled>Save manual_visual_annotation</button>
  </div>
  <div id="status"></div>
</main>
<script>
"use strict";
const canvas = document.querySelector("#canvas");
const context = canvas.getContext("2d");
const statusNode = document.querySelector("#status");
let session = null;
let current = 0;
let image = null;
let decisions = new Map();
let loading = true;
let saving = false;
let loadToken = 0;
let displayedFrame = null;
let ready = false;

function frameRecord() { return session.frames[current]; }
function completed() { return session && session.frames.every(item => decisions.has(item.frame)); }
function updateControls() {
  if (!session) return;
  const busy = loading || saving || !ready;
  document.querySelector("#previous").disabled = busy || current === 0;
  document.querySelector("#next").disabled = busy || current === session.frames.length - 1;
  document.querySelector("#occluded").disabled = busy;
  document.querySelector("#clear").disabled = busy;
  document.querySelector("#save").disabled = busy || !completed();
  canvas.style.cursor = busy ? "wait" : "crosshair";
  document.querySelector("#progress").textContent = `Frame ${current + 1} / ${session.frames.length} (source ${frameRecord().frame})`;
}
function draw() {
  if (!image || !ready || displayedFrame !== frameRecord()) return;
  context.clearRect(0, 0, canvas.width, canvas.height);
  context.drawImage(image, 0, 0, canvas.width, canvas.height);
  const decision = decisions.get(displayedFrame.frame);
  if (decision && decision.visible) {
    context.beginPath();
    context.arc(decision.x * canvas.width, decision.y * canvas.height, 8, 0, Math.PI * 2);
    context.strokeStyle = "#ff3158";
    context.lineWidth = 3;
    context.stroke();
  }
  if (decision && !decision.visible) {
    context.fillStyle = "rgba(0,0,0,.7)";
    context.fillRect(0, canvas.height - 36, canvas.width, 36);
    context.fillStyle = "#f6c85f";
    context.fillText("HUMAN MARKED OCCLUDED", 12, canvas.height - 13);
  }
  updateControls();
}
function showFrame(index) {
  if (!session || saving || index < 0 || index >= session.frames.length) return;
  const requestedRecord = session.frames[index];
  const token = ++loadToken;
  loading = true;
  ready = false;
  statusNode.textContent = `Loading source frame ${requestedRecord.frame}…`;
  updateControls();
  image = new Image();
  const requestedImage = image;
  image.onload = () => {
    if (token !== loadToken || requestedImage !== image) return;
    current = index;
    displayedFrame = requestedRecord;
    loading = false;
    ready = true;
    canvas.width = requestedRecord.width;
    canvas.height = requestedRecord.height;
    statusNode.textContent = `Loaded source frame ${requestedRecord.frame}.`;
    draw();
  };
  image.onerror = () => {
    if (token !== loadToken || requestedImage !== image) return;
    loading = false;
    ready = false;
    statusNode.textContent = `Frame ${requestedRecord.frame} failed to load; no annotation was recorded.`;
    updateControls();
  };
  image.src = "/" + requestedRecord.path;
}
canvas.addEventListener("click", event => {
  if (loading || saving || !ready || displayedFrame !== frameRecord()) return;
  const bounds = canvas.getBoundingClientRect();
  const x = Math.min(1, Math.max(0, (event.clientX - bounds.left) / bounds.width));
  const y = Math.min(1, Math.max(0, (event.clientY - bounds.top) / bounds.height));
  decisions.set(displayedFrame.frame, {frame: displayedFrame.frame, x, y, visible: true});
  statusNode.textContent = "Human click recorded for this frame.";
  draw();
});
document.querySelector("#occluded").onclick = () => {
  if (loading || saving || !ready || displayedFrame !== frameRecord()) return;
  decisions.set(displayedFrame.frame, {frame: displayedFrame.frame, x: null, y: null, visible: false});
  statusNode.textContent = "Human marked this frame occluded.";
  draw();
};
document.querySelector("#clear").onclick = () => {
  if (loading || saving || !ready || displayedFrame !== frameRecord()) return;
  decisions.delete(displayedFrame.frame);
  draw();
};
document.querySelector("#previous").onclick = () => {
  if (loading || saving || !ready) return;
  showFrame(current - 1);
};
document.querySelector("#next").onclick = () => {
  if (loading || saving || !ready) return;
  showFrame(current + 1);
};
document.querySelector("#save").onclick = async () => {
  if (loading || saving || !ready || displayedFrame !== frameRecord() || !completed()) return;
  saving = true;
  updateControls();
  const payload = {
    schema_version: "0.1",
    evidence_type: "manual_visual_annotation",
    scene_id: session.scene_id,
    shot_id: session.shot_id,
    track_id: session.track_id,
    video_sha256: session.video_sha256,
    trajectory_file_sha256: session.trajectory_file_sha256,
    points: session.frames.map(item => decisions.get(item.frame))
  };
  try {
    const response = await fetch("/annotation", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload)
    });
    if (!response.ok) {
      const failure = await response.json();
      throw new Error(failure.error?.message || "Save rejected");
    }
    await response.json();
    statusNode.textContent = "Manual annotation saved.";
  } catch (error) {
    statusNode.textContent = `Save failed: ${String(error)}`;
  } finally {
    saving = false;
    updateControls();
  }
};

fetch("/session", {cache: "no-store"}).then(response => {
  if (!response.ok) throw new Error("Session manifest unavailable");
  return response.json();
}).then(value => {
  session = value;
  document.querySelector("#identity").textContent = `${session.scene_id} / ${session.shot_id} / ${session.track_id}`;
  showFrame(0);
}).catch(error => { statusNode.textContent = String(error); });
</script>
</body>
</html>
