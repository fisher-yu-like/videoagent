[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videoactagent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["imageio-ffmpeg==0.6.0", "numpy", "Pillow", "json-repair>=0.62.0", "typing-extensions>=4.0; python_version < '3.8'"]

[project.optional-dependencies]
upload = ["tos>=2.9.0"]

[project.scripts]
videoactagent = "videoactagent.cli:main"
videoactagent-coded-draft = "videoactagent.coded_draft:main"

[tool.setuptools.packages.find]
include = ["videoactagent*"]
